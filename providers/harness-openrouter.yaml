# Provider profile: Harness -> OpenRouter.
# Only /usr/local/bin/harness may use the key, and only toward openrouter.ai.
id: harness-openrouter
display_name: Harness (OpenRouter)
description: OpenRouter inference access for the Harness coding agent
category: inference
inference_capable: true

credentials:
  - name: api_key
    description: OpenRouter API key
    env_vars: [OPENROUTER_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization

discovery:
  credentials: [api_key]

endpoints:
  - host: openrouter.ai
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce

binaries:
  - /usr/local/bin/harness
