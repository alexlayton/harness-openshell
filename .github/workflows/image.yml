name: Sandbox image

# Builds ghcr.io/<owner>/harness-openshell for linux/amd64 and linux/arm64.
# Both architectures install the published Harness release (harness_ref must be
# a release tag, for example v0.9.0), so nothing is compiled here.
# Each architecture builds natively on its own runner (no QEMU), then the two
# digests are merged into one multi-arch tag.

on:
  workflow_dispatch:
    inputs:
      harness_ref:
        description: Harness release tag to install
        default: v0.9.0
  push:
    branches: [main]
    paths:
      - image/**
      - .github/workflows/image.yml

permissions:
  contents: read

env:
  HARNESS_REPO: alexlayton/harness
  HARNESS_REF: ${{ inputs.harness_ref || 'v0.9.0' }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image name and platform label
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/harness-openshell" >> "$GITHUB_ENV"
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image
          file: image/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            HARNESS_VERSION=${{ env.HARNESS_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ env.HARNESS_REPO }}
            org.opencontainers.image.description=Harness coding agent for OpenShell sandboxes
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish multi-arch tag
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/harness-openshell"
          ref_tag="$(printf '%s' "${HARNESS_REF}" | tr '/:' '--')"
          sources=$(printf "${image}@sha256:%s " *)
          docker buildx imagetools create \
            --tag "${image}:latest" \
            --tag "${image}:${ref_tag}" \
            ${sources}
      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/harness-openshell:latest"
